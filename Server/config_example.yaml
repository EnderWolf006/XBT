# 当前环境 prod / test / dev
app_env: prod

# 端口号，默认为 3030
http_addr: ":3030"

# JWT 签名密钥，务必修改
jwt_secret: "CHANGE_ME_JWT_SECRET"

# 账号密码加解密密钥，务必修改
credential_secret: "CHANGE_ME_CREDENTIAL_SECRET"

# 仅在明确了解风险时允许不安全的 TLS 连接；部署默认校验证书。
allow_insecure_tls: false

# 学习通 AES 加密密钥，无需修改
chaoxing_aes_key: "u2oh6Vu^HWe4_AES"

# 请求学习通的 User-Agent，如果你不知道何意味保持默认值即可
chaoxing_user_agent: "Dalvik/2.1.0 (Linux; U; Android 14; Redmi K20 Pro Build/UKQ1.230804.001) (schild:0945de15614364966e17460057ab5aa6) (device:Redmi K20 Pro) Language/zh_CN com.chaoxing.mobile/ChaoXingStudy_3_6.4.8_android_phone_10834_264 (@Kalimdor)_aa664e5fbb1d46df8e5aa65f62a438d8"

# 每门课程返回给前端的活动上限（默认 5）
activity_list_limit: 5

# 公开访问：跳过登录白名单。默认 false。
public_access: false

# 公开访问时可将所有成功登录用户设为管理员。仅在完全信任所有访客时启用。默认 false。
public_admin: false

# 关闭全部管理员 API 路由。默认 false。
disable_admin: false

# 仅允许使用本人保存的地点；隐藏旧公共记录并禁用公共地点管理写入。
personal_locations_only: false

# 图片缓存只放磁盘：总计200MiB、单张2MiB、最多1024项、2个并发回源。
# Linux生产部署建议使用已授权应用用户写入的 /var/cache/xbt/images。
media_cache_dir: "cache/images"

# 全站签到偏移（角度）：仅提交时应用于 GCJ-02，默认 0 关闭，不改地图和数据库。
# 例如 latitude: -0.000093、longitude: 0.000027；不同纬度下对应的米数不同。
sign_location_offset:
  latitude: 0
  longitude: 0

# postgres 数据库连接字符串
postgres_dsn: "host=127.0.0.1 port=5432 user=xbt password=CHANGE_ME_DB_PASSWORD dbname=xbt sslmode=disable TimeZone=Asia/Shanghai"

# 高德 Web Service 配置，API Key 只放在后端
amap:
  api_key: ""
  campus_address: ""
  js_api_key: ""
  security_js_code: ""

# 可选：部署前批量导入签到地点。坐标必须由管理员核实；默认状态为 pending。
# 详见 locations.example.yaml。
sign_locations: []
